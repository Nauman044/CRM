<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch Link | Admin Dashboard</title>
<link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/mrartist048/fmcsa-control@main/favicon.png">
<script>document.documentElement.dataset.theme=localStorage.getItem('dl_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- Icon sprite (no emojis) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-users" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 5.24A9.1 9.1 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
  <symbol id="i-arrow-left" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></symbol>
</svg>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<!-- Summary modal -->
<div class="modal" id="summaryModal">
  <div class="modal-box">
    <h3>Shift summary report</h3>
    <div id="modalSummaryBody"></div>
    <div class="modal-actions">
      <button class="btn primary" onclick="copySummaryText()">Copy summary</button>
      <button class="btn" onclick="closeSummaryModal()">Close</button>
    </div>
  </div>
</div>

<div class="layout">
  <aside class="sidebar" id="appSidebar">
    <div class="brand"><div class="brand-logo"><img src="https://cdn.jsdelivr.net/gh/mrartist048/fmcsa-control@main/favicon.png" alt="Dispatch Link" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo-fallback',textContent:'DL'}))"></div><div><div class="brand-name" id="brandTitle">Dispatch Link</div><div class="brand-sub">USA shift control panel</div></div></div>
    <nav>
      <button id="tabOnline" class="nav-btn active" onclick="switchTab('online')"><svg class="ico"><use href="#i-users"/></svg>Online users</button>
      <button id="tabLeaderboard" class="nav-btn" onclick="switchTab('leaderboard')"><svg class="ico"><use href="#i-chart"/></svg>Calling leaderboard</button>
      <button id="tabReports" class="nav-btn" onclick="switchTab('reports')"><svg class="ico"><use href="#i-file"/></svg>Shift reports &amp; ratios</button>
    </nav>
    <a class="back-link" href="hub.html"><svg class="ico"><use href="#i-arrow-left"/></svg>Back to admin panel</a>
    <div class="license">
      <div class="license-title"><span>License status</span><svg class="ico"><use href="#i-lock"/></svg></div>
      <div class="license-row"><span>Max allowed tabs</span><b id="sidebarMaxLimit">-</b></div>
      <div class="license-row"><span>Active sessions</span><b id="sidebarActiveSessions">-</b></div>
    </div>
  </aside>

  <section class="main">
    <header class="topbar">
      <div class="topbar-left"><button class="menu-toggle" onclick="toggleSidebar()" aria-label="Open menu"><svg class="ico"><use href="#i-menu"/></svg></button><div id="pageTitle">Online users</div></div>
      <div class="topbar-actions">
        <button class="btn primary" onclick="openSummaryModal()">Shift summary</button>
        <button class="btn" onclick="renderContent()"><svg class="ico"><use href="#i-refresh"/></svg>Refresh</button>
        <button class="btn success" id="exportBtn" onclick="exportCSV()" style="display:none"><svg class="ico"><use href="#i-download"/></svg>Export CSV</button>
      </div>
    </header>

    <div id="filterBar" class="filterbar" style="display:none">
      <div class="fgroup"><span>USA date filter</span>
        <button id="presetToday" class="chip active" onclick="setDateFilterPreset('today')">Today (USA)</button>
        <button id="presetWeek" class="chip" onclick="setDateFilterPreset('week')">Last 7 days</button></div>
      <div class="fgroup"><span>Custom range</span><input type="text" id="unifiedDateRangePicker" placeholder="Select date or range"></div>
    </div>

    <div class="body" id="adminBodyContent">Sign in to load statistics.</div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="auth.js"></script>
<script src="admin.js"></script>
</body>
</html>
